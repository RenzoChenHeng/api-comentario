service: api-comentario

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}

  environment:
    TABLE_NAME: ${sls:stage}-t_comentarios
    BUCKET_NAME:
      Ref: BucketIngestaComentarios
    STAGE: ${sls:stage}

functions:
  comentario:
    handler: comentario.lambda_handler
    events:
      - http:
          path: comentario/crear
          method: post
          cors: true

resources:
  Resources:

    TablaComentarios:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${sls:stage}-t_comentarios
        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: uuid
            AttributeType: S

        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: uuid
            KeyType: RANGE

    BucketIngestaComentarios:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: renzoliang-comentarios-${sls:stage}-${aws:accountId}
